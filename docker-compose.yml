version: '3.8'

services:
  bff:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/bff-template:v1.0.0
    container_name: bff-service
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - BFF_MODE=stub
      - SIMULATED_LATENCY_MS=0
      - CORS_ORIGIN=http://localhost:4200,http://localhost:4207,http://localhost:8080
      - UPSTREAM_MAIN_API_URL=http://main-api:8080
      - UPSTREAM_SECURE_API_URL=http://secure-api:8080
      - UPSTREAM_PICKER1_API_URL=http://picker1-api:8080
      - UPSTREAM_PICKER2_API_URL=http://picker2-api:8080
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/healthz', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - bff-net
    # Docker Swarm Orchestration Block (Used with: docker stack deploy -c docker-compose.yml bff)
    deploy:
      mode: replicated
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M

networks:
  bff-net:
    driver: overlay
    attachable: true

